<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticket to Ride</title>
<link rel="stylesheet" href="style.css">
<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
</head>
<body>
<header>
  <h1>Ticket to Ride</h1>
  <div id="status"></div>
  <div id="playback" class="hidden">
    <button id="pbPause" class="pb-btn" title="Pause bots (Space)" aria-label="Pause bots">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><g class="ic-pause"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></g><path class="ic-play" d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
    </button>
    <span class="pb-sep"></span>
    <button id="pbBack" class="pb-btn" title="Previous move (←)" aria-label="Previous move">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="5" y="5" width="3" height="14" rx="1"/><path d="M19 6.2v11.6a1 1 0 0 1-1.53.85L9.3 13.1a1.3 1.3 0 0 1 0-2.2l8.17-5.55A1 1 0 0 1 19 6.2z"/></svg>
    </button>
    <span id="pbLabel">Live</span>
    <button id="pbFwd" class="pb-btn" title="Next move (→)" aria-label="Next move">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="16" y="5" width="3" height="14" rx="1"/><path d="M5 6.2v11.6a1 1 0 0 0 1.53.85l8.17-5.55a1.3 1.3 0 0 0 0-2.2L6.53 5.35A1 1 0 0 0 5 6.2z"/></svg>
    </button>
    <button id="pbLive" class="pb-live" title="Back to the live game">Live</button>
  </div>
  <button id="newGameBtn" class="btn">New game</button>
  <div id="settingsWrap">
    <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
    <div id="settingsMenu" class="hidden" role="dialog" aria-label="Settings">
      <h3>Settings</h3>
      <div class="setting">
        <div class="setting-label">Bot speed</div>
        <div class="seg" id="botSpeed" role="radiogroup" aria-label="Bot speed">
          <button data-speed="slow" role="radio">Slow</button>
          <button data-speed="normal" role="radio">Normal</button>
          <button data-speed="fast" role="radio">Fast</button>
          <button data-speed="instant" role="radio">Instant</button>
        </div>
        <div class="setting-hint" id="botSpeedHint"></div>
      </div>
    </div>
  </div>
</header>
<main>
  <section id="boardWrap">
    <svg id="board" viewBox="0 0 1400 934" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="tooltip" class="hidden"></div>
    <div id="toast" class="hidden"></div>
  </section>
  <aside id="side">
    <div id="players"></div>
    <div class="panel">
      <h3>Train cards</h3>
      <div id="faceUp"></div>
      <div id="decks">
        <button id="deckBtn" class="deck-btn"><span class="deck-face">Deck</span><small id="deckCount"></small></button>
        <button id="ticketBtn" class="deck-btn tickets"><span class="deck-face">Destination<br>tickets</span><small id="ticketCount"></small></button>
      </div>
      <button id="passBtn" class="btn hidden">Pass (no legal move)</button>
    </div>
    <div class="panel hidden" id="enginePanel">
      <h3>Engine view <label class="toggle"><input type="checkbox" id="hintToggle"> show</label></h3>
      <div id="engineBody"></div>
    </div>
    <div class="panel log-panel">
      <h3>Log</h3>
      <ol id="log"></ol>
    </div>
  </aside>
</main>
<footer id="tray">
  <div class="tray-section">
    <h3 id="handTitle">Your hand</h3>
    <div id="hand"></div>
  </div>
  <div class="tray-section">
    <h3>Your destination tickets</h3>
    <div id="myTickets"></div>
  </div>
</footer>
<div id="modal" class="hidden"><div id="modalBox"></div></div>
<script src="board_layout.js"></script>
<script src="app.js"></script>
</body>
</html>
